name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: "Backend: tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio httpx

      - name: Run tests
        working-directory: backend
        # No MongoDB and no OPENAI_API_KEY: the suite asserts that every
        # endpoint degrades to its deterministic path instead of failing.
        env:
          MONGODB_URL: mongodb://127.0.0.1:1/
          OPENAI_API_KEY: ''
          PYTHONIOENCODING: utf-8
        run: pytest test_api.py -q

      - name: Check the app imports cleanly
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
        run: python -c "import server; print(f'{len(server.app.routes)} routes registered')"

  frontend:
    name: "Frontend: build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: frontend
        # CI=true turns React warnings into build failures.
        env:
          CI: true
        run: npm run build

      - name: Assert Tailwind actually compiled
        working-directory: frontend
        # Guards the craco/PostCSS wiring: if postcss.config.js stops being
        # picked up, the directives pass through as literal text and every
        # utility class silently does nothing. Cheap check, caught it once.
        run: |
          # Only the emitted stylesheets. The .css.map sourcemap legitimately
          # embeds the original source, @tailwind directives and all, so
          # including it here would always report a false failure.
          css=$(find build/static/css -name '*.css' ! -name '*.map')
          test -n "$css" || { echo "::error::No stylesheet was emitted"; exit 1; }

          if grep -q '@tailwind' $css; then
            echo "::error::Tailwind directives were not compiled - PostCSS did not run"
            exit 1
          fi
          grep -q '\.min-h-screen{' $css || {
            echo "::error::Tailwind utilities missing from the build output"
            exit 1
          }
          echo "Tailwind compiled correctly"
